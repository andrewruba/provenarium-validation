name: CLI verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check free-tier deployment configuration
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const blueprint = parse(readFileSync('render.yaml', 'utf8'));
          assert.deepEqual(Object.keys(blueprint), ['services']);
          assert.equal(blueprint.services.length, 2);
          const modes = [];
          for (const service of blueprint.services) {
            assert.equal(service.type, 'web');
            assert.equal(service.runtime, 'node');
            assert.equal(service.plan, 'free');
            assert.equal(service.branch, 'main');
            assert.equal(service.autoDeployTrigger, 'checksPass');
            assert.equal(service.healthCheckPath, '/health');
            assert.equal(service.disk, undefined);
            const environment = Object.fromEntries(service.envVars.map(({ key, value }) => [key, value]));
            assert.equal(environment.HOST, '0.0.0.0');
            assert.equal(environment.NODE_VERSION, readFileSync('.nvmrc', 'utf8').trim());
            modes.push(environment.DILUTION_MODE);
          }
          assert.deepEqual(modes.sort(), ['correct', 'faulty']);
          console.log('Both demo services use free compute and wait for CI checks.');
          JS
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - name: Pack and verify installation outside the repository
        run: npm run verify:package
