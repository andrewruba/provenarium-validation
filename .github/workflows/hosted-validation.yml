name: Published Pages validation

# Run after the Pages deployment is live; the ordinary CI suite validates the
# same static build locally before publishing.
on:
  workflow_dispatch:
    inputs:
      correct_url:
        description: Full corrected Pages URL (including /correct/)
        required: true
        type: string
        default: https://andrewruba.github.io/provenarium-validation/correct/
      faulty_url:
        description: Full faulty Pages URL (including /faulty/)
        required: true
        type: string
        default: https://andrewruba.github.io/provenarium-validation/faulty/

permissions:
  contents: read

concurrency:
  group: published-pages-validation
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate both hosted versions using the CLI
        env:
          CORRECT_URL: ${{ inputs.correct_url }}
          FAULTY_URL: ${{ inputs.faulty_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node scripts/validate-pages-dilution.mjs
          --correct-url "$CORRECT_URL"
          --faulty-url "$FAULTY_URL"
          --commit "$EXPECTED_COMMIT"
          --output hosted-evidence
      - name: Retain reports and observations even if comparison fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-dilution-evidence-${{ github.run_id }}
          path: hosted-evidence/
          if-no-files-found: warn
          retention-days: 14
